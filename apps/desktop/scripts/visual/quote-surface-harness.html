    <!--
      A REAL-BROWSER PAGE for two founder reports about the concierge's quote chrome: the copy glyph
      overlapping the blue blockquote rule, and the "Quote in response" chiclet being a full capsule.

      The first is a float rule jsdom does not implement — a float shortens the LINE BOXES beside it,
      never a following BLOCK's box, so the blockquote's border-left is laid under the floated glyph
      while its text is pushed clear. See quote-surface-probe.mjs.
    -->
